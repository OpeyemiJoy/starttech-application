
name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "k8s/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Tests
        run: |
          cd backend
          go test ./...

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region eu-north-1 |
          docker login --username AWS --password-stdin \
          513282885838.dkr.ecr.eu-north-1.amazonaws.com

      - name: Build Docker Image
        run: |
          docker build \
          -t starttech-backend-api:${{ github.sha }} \
          backend

      - name: Tag Image
        run: |
          docker tag \
          starttech-backend-api:${{ github.sha }} \
          513282885838.dkr.ecr.eu-north-1.amazonaws.com/starttech-backend-api:${{ github.sha }}

      - name: Scan Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 513282885838.dkr.ecr.eu-north-1.amazonaws.com/starttech-backend-api:${{ github.sha }}
          severity: HIGH,CRITICAL

      - name: Push Image
        run: |
          docker push \
          513282885838.dkr.ecr.eu-north-1.amazonaws.com/starttech-backend-api:${{ github.sha }}

      - name: Update Kubernetes manifest image
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/deployment.yaml

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig \
          --name starttech-cluster \
          --region eu-north-1

          kubectl apply -f k8s/

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/backend-api
