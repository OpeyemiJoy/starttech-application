name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - run: aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 513282885838.dkr.ecr.eu-north-1.amazonaws.com
      - run: cd backend && docker build -t starttech-backend-api:latest . && docker tag starttech-backend-api:latest 513282885838.dkr.ecr.eu-north-1.amazonaws.com/starttech-backend-api:latest && docker push 513282885838.dkr.ecr.eu-north-1.amazonaws.com/starttech-backend-api:latest
      - run: aws eks update-kubeconfig --name starttech-cluster --region eu-north-1 && kubectl set image deployment/backend-api backend-api=513282885838.dkr.ecr.eu-north-1.amazonaws.com/starttech-backend-api:latest
